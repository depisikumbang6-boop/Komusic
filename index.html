<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NUANG LUDO</title>
    <script src="https://cdn.tailwindcss.com"></script>
  <style>
        /* 3D Location-Pin Style Game Coins (Bigger size, tip anchored dead-center on cell) */
        .token {
            position: absolute;
            width: 6.1%;
            height: 8.2%;
            transform-origin: 50% 88%;
            transform: translate(-50%, -88%) scale(var(--tk-scale, 1));
            transition: left 0.26s cubic-bezier(0.34, 1.56, 0.64, 1),
                        top 0.26s cubic-bezier(0.34, 1.56, 0.64, 1),
                        transform 0.2s ease,
                        filter 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            cursor: default;
            filter: drop-shadow(0 3.5px 3.5px rgba(15, 23, 42, 0.5));
        }

        .token svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Valid Move Highlighting for 3D Location Pin */
        .token.movable {
            cursor: pointer;
            z-index: 35 !important;
            animation: bouncePin 0.85s infinite ease-in-out;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.95)) drop-shadow(0 0 11px rgba(59, 130, 246, 0.95));
        }

        .token.movable:hover {
            transform: translate(-50%, -96%) scale(1.2) !important;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            background: radial-gradient(circle at 20% 10%, #ffffff 0%, #eef2ff 45%, #dbeafe 100%);
            transition: background 0.3s ease, color 0.25s ease;
        }

        .dark body,
        html.dark body {
            background: radial-gradient(circle at 20% 10%, #1e293b 0%, #0f172a 55%, #020617 100%);
        }

        body.playing-mode {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            padding: 0 !important;
        }

        h1, h2, h3, .font-display {
            font-family: 'Fredoka', sans-serif;
        }

        /* 3D Volumetric Surfaces & Buttons */
        .surface-3d {
            background: linear-gradient(155deg, rgba(255, 255, 255, 0.96) 0%, rgba(241, 245, 249, 0.92) 100%);
            box-shadow:
                0 18px 36px -12px rgba(15, 23, 42, 0.16),
                0 4px 10px -2px rgba(15, 23, 42, 0.08),
                inset 0 1.5px 1px rgba(255, 255, 255, 0.95),
                inset 0 -2px 4px rgba(148, 163, 184, 0.18);
        }

        .dark .surface-3d {
            background: linear-gradient(155deg, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.96) 100%);
            box-shadow:
                0 20px 40px -12px rgba(0, 0, 0, 0.68),
                0 4px 12px -2px rgba(0, 0, 0, 0.45),
                inset 0 1px 1px rgba(255, 255, 255, 0.12),
                inset 0 -2px 5px rgba(0, 0, 0, 0.5);
        }

        .btn-3d-primary {
            background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
            box-shadow:
                0 6px 0 #1e3a8a,
                0 12px 22px -4px rgba(29, 78, 216, 0.45),
                inset 0 1.5px 1px rgba(255, 255, 255, 0.45);
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.15s ease;
        }
        .btn-3d-primary:hover:not(:disabled) {
            filter: brightness(1.06);
        }
        .btn-3d-primary:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow:
                0 3px 0 #1e3a8a,
                0 6px 12px -2px rgba(29, 78, 216, 0.4),
                inset 0 1.5px 1px rgba(255, 255, 255, 0.35);
        }

        /* Board Frame - 3D Beveled Outer Tray */
        .board-wrapper {
            width: min(92vw, 62vh, 660px);
            height: min(92vw, 62vh, 660px);
            aspect-ratio: 1 / 1;
            position: relative;
            border-radius: 24px;
            padding: 9px;
            background: linear-gradient(145deg, #ffffff 0%, #e2e8f0 55%, #cbd5e1 100%);
            box-shadow:
                0 22px 44px -10px rgba(15, 23, 42, 0.28),
                0 8px 16px -4px rgba(15, 23, 42, 0.14),
                inset 0 2px 2px rgba(255, 255, 255, 0.95),
                inset 0 -4px 8px rgba(100, 116, 139, 0.32);
            transition: width 0.25s ease, height 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
        }

        .dark .board-wrapper {
            background: linear-gradient(145deg, #334155 0%, #1e293b 55%, #0f172a 100%);
            box-shadow:
                0 24px 48px -10px rgba(0, 0, 0, 0.78),
                0 8px 18px -4px rgba(0, 0, 0, 0.55),
                inset 0 1.5px 1.5px rgba(255, 255, 255, 0.16),
                inset 0 -4px 8px rgba(0, 0, 0, 0.65);
        }

        @media (min-width: 1024px) {
            .board-wrapper {
                width: min(68vw, 72vh, 720px);
                height: min(68vw, 72vh, 720px);
            }
        }

        /* Exact 15x15 Coordinate Reference Container */
        .board-stage {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 15px;
            overflow: visible;
            box-shadow: inset 0 0 0 1.5px #334155, 0 2px 6px rgba(15, 23, 42, 0.18);
        }

        .ludo-grid {
            display: grid;
            grid-template-columns: repeat(15, minmax(0, 1fr));
            grid-template-rows: repeat(15, minmax(0, 1fr));
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 15px;
            overflow: hidden;
        }

        .cell {
            border: 0.5px solid rgba(100, 116, 139, 0.32);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.72), rgba(241, 245, 249, 0.35));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
        }

        .dark .cell {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.65));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        /* 3D Volumetric Base Yard Areas (6x6 corners) */
        .base-red {
            background: radial-gradient(circle at 25% 20%, #f87171 0%, #ef4444 50%, #b91c1c 100%);
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.4), inset 0 -3px 6px rgba(127, 29, 29, 0.45);
            border: none;
        }
        .base-green {
            background: radial-gradient(circle at 25% 20%, #4ade80 0%, #22c55e 50%, #15803d 100%);
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.4), inset 0 -3px 6px rgba(20, 83, 45, 0.45);
            border: none;
        }
        .base-yellow {
            background: radial-gradient(circle at 25% 20%, #fde047 0%, #eab308 50%, #a16207 100%);
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.45), inset 0 -3px 6px rgba(113, 63, 18, 0.45);
            border: none;
        }
        .base-blue {
            background: radial-gradient(circle at 25% 20%, #60a5fa 0%, #3b82f6 50%, #1d4ed8 100%);
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.4), inset 0 -3px 6px rgba(30, 58, 138, 0.45);
            border: none;
        }

        /* Exact Recessed 3D Inner Yard Box */
        .base-inner-box {
            position: absolute;
            inset: 13.3333%;
            background: linear-gradient(145deg, #f8fafc 0%, #ffffff 60%, #e2e8f0 100%);
            border-radius: 18%;
            box-shadow:
                inset 0 4px 10px rgba(15, 23, 42, 0.18),
                inset 0 -2px 4px rgba(255, 255, 255, 0.9),
                0 3px 8px rgba(15, 23, 42, 0.22);
        }

        .dark .base-inner-box {
            background: linear-gradient(145deg, #0b1120 0%, #0f172a 65%, #1e293b 100%);
            box-shadow:
                inset 0 4px 12px rgba(0, 0, 0, 0.65),
                inset 0 -1px 3px rgba(255, 255, 255, 0.08),
                0 3px 8px rgba(0, 0, 0, 0.5);
        }

        /* 3D Recessed Yard Sockets rendered in .board-stage */
        .yard-socket {
            position: absolute;
            width: 5.5%;
            height: 5.5%;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: inset 0 3px 6px rgba(15, 23, 42, 0.28), 0 1px 2px rgba(255, 255, 255, 0.75);
            pointer-events: none;
            z-index: 5;
        }
        .yard-socket-red { background: radial-gradient(circle at 65% 65%, #fecaca, #fee2e2); border: 2px solid var(--red-main); }
        .yard-socket-green { background: radial-gradient(circle at 65% 65%, #bbf7d0, #dcfce7); border: 2px solid var(--green-main); }
        .yard-socket-yellow { background: radial-gradient(circle at 65% 65%, #fef08a, #fef9c3); border: 2px solid var(--yellow-main); }
        .yard-socket-blue { background: radial-gradient(circle at 65% 65%, #bfdbfe, #dbeafe); border: 2px solid var(--blue-main); }

        .dark .yard-socket-red { background: radial-gradient(circle at 65% 65%, rgba(127, 29, 29, 0.6), rgba(239, 68, 68, 0.25)); box-shadow: inset 0 3px 6px rgba(0,0,0,0.6); }
        .dark .yard-socket-green { background: radial-gradient(circle at 65% 65%, rgba(20, 83, 45, 0.6), rgba(34, 197, 94, 0.25)); box-shadow: inset 0 3px 6px rgba(0,0,0,0.6); }
        .dark .yard-socket-yellow { background: radial-gradient(circle at 65% 65%, rgba(113, 63, 18, 0.6), rgba(234, 179, 8, 0.25)); box-shadow: inset 0 3px 6px rgba(0,0,0,0.6); }
        .dark .yard-socket-blue { background: radial-gradient(circle at 65% 65%, rgba(30, 58, 138, 0.6), rgba(59, 130, 246, 0.25)); box-shadow: inset 0 3px 6px rgba(0,0,0,0.6); }

        /* Vivid Color-Coded 3D Gradient Home-Stretch & Entry Tracks */
        .track-red {
            background: linear-gradient(145deg, #fca5a5 0%, #ef4444 48%, #b91c1c 100%) !important;
            border: 1px solid #991b1b !important;
            box-shadow: inset 0 1.5px 2px rgba(255, 255, 255, 0.6), inset 0 -2px 4px rgba(127, 29, 29, 0.45) !important;
        }
        .track-green {
            background: linear-gradient(145deg, #86efac 0%, #22c55e 48%, #15803d 100%) !important;
            border: 1px solid #166534 !important;
            box-shadow: inset 0 1.5px 2px rgba(255, 255, 255, 0.6), inset 0 -2px 4px rgba(20, 83, 45, 0.45) !important;
        }
        .track-yellow {
            background: linear-gradient(145deg, #fef08a 0%, #eab308 48%, #a16207 100%) !important;
            border: 1px solid #854d0e !important;
            box-shadow: inset 0 1.5px 2px rgba(255, 255, 255, 0.7), inset 0 -2px 4px rgba(113, 63, 18, 0.45) !important;
        }
        .track-blue {
            background: linear-gradient(145deg, #93c5fd 0%, #3b82f6 48%, #1d4ed8 100%) !important;
            border: 1px solid #1e40af !important;
            box-shadow: inset 0 1.5px 2px rgba(255, 255, 255, 0.6), inset 0 -2px 4px rgba(30, 58, 138, 0.45) !important;
        }

        /* Animated Icon-Only Settings Dropdown */
        .settings-menu-panel {
            opacity: 0;
            transform: translateY(-10px) scale(0.92);
            pointer-events: none;
            transform-origin: top right;
            transition: opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .settings-menu-panel.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        .gear-icon-spin {
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .gear-icon-spin.rotated {
            transform: rotate(90deg);
        }

        /* Center Home Goal (3x3 area) */
        .center-goal {
            grid-column: 7 / 10;
            grid-row: 7 / 10;
            position: relative;
            border: 1px solid #334155;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.25);
        }

        /* Tokens Layer - Exact 1:1 overlay with .ludo-grid */
        .tokens-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 20;
        }

        /* 3D Location-Pin Style Game Coins (Tip anchored exactly on cell center) */
        .token {
            position: absolute;
            width: 5.4%;
            height: 7.2%;
            transform-origin: 50% 88%;
            transform: translate(-50%, -88%) scale(var(--tk-scale, 1));
            transition: left 0.26s cubic-bezier(0.34, 1.56, 0.64, 1),
                        top 0.26s cubic-bezier(0.34, 1.56, 0.64, 1),
                        transform 0.2s ease,
                        filter 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            cursor: default;
            filter: drop-shadow(0 3px 3px rgba(15, 23, 42, 0.48));
        }

        .token svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Valid Move Highlighting for 3D Location Pin */
        .token.movable {
            cursor: pointer;
            z-index: 35 !important;
            animation: bouncePin 0.85s infinite ease-in-out;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.95)) drop-shadow(0 0 10px rgba(59, 130, 246, 0.9));
        }

        .token.movable:hover {
            transform: translate(-50%, -96%) scale(1.22) !important;
        }

        @keyframes bouncePin {
            0%, 100% { transform: translate(-50%, -88%) scale(1.08); }
            50% { transform: translate(-50%, -102%) scale(1.22); }
        }

        /* Seamless 3D Cube Dice (Zero Edge Seams or Corner Artifacts) */
        .dice-scene {
            --dice-size: 56px;
            --half-size: 28px;
            width: var(--dice-size);
            height: var(--dice-size);
            perspective: 480px;
            cursor: pointer;
            flex-shrink: 0;
            padding: 2px;
        }

        @media (min-width: 640px) {
            .dice-scene {
                --dice-size: 62px;
                --half-size: 31px;
            }
        }

        .dice-cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.65s cubic-bezier(0.2, 0.9, 0.3, 1.1);
        }

        .dice-cube.rolling {
            animation: spinDice 0.55s linear infinite;
        }

        @keyframes spinDice {
            0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: rotateX(360deg) rotateY(720deg) rotateZ(360deg); }
        }

        /* Internal Solid Core Prevents Any Background Bleed Through Rounded Corners */
        .dice-core {
            position: absolute;
            inset: 3px;
            background: #cbd5e1;
            border-radius: 6px;
            transform-style: preserve-3d;
        }

        .dice-face {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background: linear-gradient(145deg, #ffffff 0%, #f1f5f9 58%, #e2e8f0 100%);
            border: 1px solid rgba(148, 163, 184, 0.55);
            border-radius: 10px;
            box-shadow: inset 0 1.5px 2px rgba(255, 255, 255, 0.95), inset 0 -1.5px 3px rgba(100, 116, 139, 0.22);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 8px;
            gap: 2px;
        }

        @media (min-width: 640px) {
            .dice-face {
                border-radius: 11px;
                padding: 9px;
            }
        }

        .pip {
            background: radial-gradient(circle at 35% 35%, #334155, #020617);
            border-radius: 50%;
            width: 9.5px;
            height: 9.5px;
            align-self: center;
            justify-self: center;
            box-shadow: inset 0 1px 1.5px rgba(0, 0, 0, 0.65), 0 0.5px 0 rgba(255, 255, 255, 0.85);
        }
        .pip.red-pip {
            background: radial-gradient(circle at 35% 35%, #f87171, #b91c1c);
            width: 12.5px;
            height: 12.5px;
        }

        @media (min-width: 640px) {
            .pip { width: 10.5px; height: 10.5px; }
            .pip.red-pip { width: 13.5px; height: 13.5px; }
        }

        .face-1 { transform: rotateY(0deg) translateZ(var(--half-size)); }
        .face-2 { transform: rotateY(90deg) translateZ(var(--half-size)); }
        .face-3 { transform: rotateY(180deg) translateZ(var(--half-size)); }
        .face-4 { transform: rotateY(-90deg) translateZ(var(--half-size)); }
        .face-5 { transform: rotateX(90deg) translateZ(var(--half-size)); }
        .face-6 { transform: rotateX(-90deg) translateZ(var(--half-size)); }

        /* Active Player Card 3D Highlight */
        .player-card-active {
            transform: translateY(-2px) scale(1.02);
            box-shadow:
                0 16px 32px -8px rgba(15, 23, 42, 0.24),
                0 4px 12px -2px rgba(15, 23, 42, 0.12),
                inset 0 1.5px 1px rgba(255, 255, 255, 0.9);
        }
        .dark .player-card-active {
            box-shadow:
                0 18px 36px -6px rgba(0, 0, 0, 0.78),
                0 4px 14px -2px rgba(0, 0, 0, 0.55),
                inset 0 1px 1px rgba(255, 255, 255, 0.16);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
    </style>
</head>
<body class="text-slate-900 dark:text-slate-100 flex flex-col items-center justify-center p-3 sm:p-5">

    <!-- LOBBY HEADER BAR (3D Isometric Dice Logo + NUANG GAMES + Inline Gear Menu on Right) -->
    <header id="lobby-header" class="relative z-40 w-full max-w-lg flex items-center justify-between surface-3d backdrop-blur-xl border border-white/80 dark:border-slate-700/80 rounded-2xl px-4 py-3 mb-4 mt-2">
        <div class="flex items-center gap-3 min-w-0">
            <!-- Custom 3D Isometric Dice Logo -->
            <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-blue-500 via-indigo-600 to-purple-700 p-1 shadow-lg flex items-center justify-center shrink-0" style="box-shadow: 0 6px 14px -2px rgba(79, 70, 229, 0.45), inset 0 1.5px 1px rgba(255,255,255,0.5);">
                <svg viewBox="0 0 64 64" class="w-full h-full drop-shadow-md">
                    <defs>
                        <linearGradient id="diceTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="100%" stop-color="#e2e8f0"/>
                        </linearGradient>
                        <linearGradient id="diceLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#cbd5e1"/>
                            <stop offset="100%" stop-color="#94a3b8"/>
                        </linearGradient>
                        <linearGradient id="diceRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#94a3b8"/>
                            <stop offset="100%" stop-color="#64748b"/>
                        </linearGradient>
                    </defs>
                    <!-- Top Face -->
                    <polygon points="32,6 56,19 32,32 8,19" fill="url(#diceTopGrad)" stroke="#ffffff" stroke-width="1"/>
                    <!-- Left Face -->
                    <polygon points="8,19 32,32 32,58 8,45" fill="url(#diceLeftGrad)"/>
                    <!-- Right Face -->
                    <polygon points="56,19 32,32 32,58 56,45" fill="url(#diceRightGrad)"/>
                    <!-- Top Center Red Pip -->
                    <ellipse cx="32" cy="19" rx="4.2" ry="2.6" fill="#ef4444"/>
                    <!-- Left Face 2 Pips -->
                    <circle cx="15" cy="29" r="2.6" fill="#0f172a"/>
                    <circle cx="25" cy="46" r="2.6" fill="#0f172a"/>
                    <!-- Right Face 3 Pips -->
                    <circle cx="49" cy="29" r="2.5" fill="#0f172a"/>
                    <circle cx="44" cy="38.5" r="2.5" fill="#0f172a"/>
                    <circle cx="39" cy="48" r="2.5" fill="#0f172a"/>
                </svg>
            </div>
            <h1 class="font-display font-bold text-xl sm:text-2xl uppercase tracking-wider bg-gradient-to-r from-slate-900 via-blue-800 to-indigo-900 dark:from-white dark:via-blue-200 dark:to-indigo-300 bg-clip-text text-transparent leading-none truncate">NUANG LUDO</h1>
        </div>

        <!-- Inline Settings Gear Button + Animated Icon-Only Dropdown Menu -->
        <div id="lobby-settings-wrapper" class="relative shrink-0">
            <button id="settings-toggle-btn" onclick="toggleSettingsMenu(event)" class="w-10 h-10 rounded-xl bg-gradient-to-b from-white to-slate-100 hover:to-slate-200 dark:from-slate-800 dark:to-slate-900 dark:hover:from-slate-700 border border-slate-200/90 dark:border-slate-700 flex items-center justify-center text-slate-700 dark:text-slate-200 shadow-sm active:scale-95 transition" aria-label="Settings" title="Settings">
                <svg id="lobby-gear-svg" class="gear-icon-spin w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
            </button>

            <!-- Icon-Only Animated Dropdown Menu (Zero Text Labels) -->
            <div id="settings-dropdown" class="settings-menu-panel absolute right-0 mt-2.5 surface-3d backdrop-blur-xl border border-white/85 dark:border-slate-700/85 rounded-2xl p-2 shadow-2xl flex flex-col items-center gap-1.5 z-50">

    <script>
        /**
         * ============================================================================
         * THEME & ANIMATED ICON-ONLY SETTINGS DROPDOWN MANAGEMENT
         * ============================================================================
         */
        let isDarkMode = false;

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.documentElement.classList.toggle('dark', isDarkMode);
            applyTranslations();
        }

        function toggleSettingsMenu(event) {
            if (event) event.stopPropagation();
            const dropdown = document.getElementById('settings-dropdown');
            const gear = document.getElementById('lobby-gear-svg');
            const isOpen = dropdown.classList.toggle('open');
            if (gear) gear.classList.toggle('rotated', isOpen);
        }

        function closeSettingsMenu() {
            const dropdown = document.getElementById('settings-dropdown');
            const gear = document.getElementById('lobby-gear-svg');
            if (dropdown) dropdown.classList.remove('open');
            if (gear) gear.classList.remove('rotated');
        }

        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                initAudio();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'roll') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.exponentialRampToValueAtTime(520, now + 0.12);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'step') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(420, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.06);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.07);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'capture') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(340, now);
                    osc.frequency.exponentialRampToValueAtTime(95, now + 0.35);
                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.36);
                    osc.start(now);
                    osc.stop(now + 0.38);
                } else if (type === 'safe' || type === 'six') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.08);
                    osc.frequency.setValueAtTime(783.99, now + 0.16);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'home' || type === 'win') {
                    const notes = type === 'win' ? [523.25, 659.25, 783.99, 1046.5] : [587.33, 880];
                    notes.forEach((freq, idx) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.type = 'triangle';
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(freq, now + idx * 0.1);
                        g.gain.setValueAtTime(0.18, now + idx * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.35);
                        o.start(now + idx * 0.1);
                        o.stop(now + idx * 0.1 + 0.36);
                    });
                }
            } catch (e) { /* Ignore audio errors if blocked */ }
        }

                setSlot('green', true, true, 1);
                setSlot('yellow', true, true, 2);
                setSlot('blue', true, true, 3);
            }
            renderSetupSlots();
        }

        /**
         * ============================================================================
         * BOARD RENDERING (15x15 Grid + Exact Yard Sockets)
         * ============================================================================
         */
        function buildBoardDOM() {
            const grid = document.getElementById('ludo-grid');
            const socketsLayer = document.getElementById('yard-sockets-layer');
            grid.innerHTML = '';
            socketsLayer.innerHTML = '';

            // Helper for consistent, identical geometric SVG entry arrows across all 4 colors
            const createEntryArrowSVG = (rotationDeg, colorClass) => `
                <svg class="w-4 h-4 sm:w-5 sm:h-5 ${colorClass} drop-shadow-sm" style="transform: rotate(${rotationDeg}deg);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 12h14"/>
                    <path d="M13 6l6 6-6 6"/>
                </svg>
            `;

            const isBaseCell = (r, c) => (r < 6 && c < 6) || (r < 6 && c > 8) || (r > 8 && c > 8) || (r > 8 && c < 6);
            const isCenterCell = (r, c) => (r >= 6 && r <= 8 && c >= 6 && c <= 8);

            // 4 Corner 6x6 Base Yards
            const bases = [
                { color: 'red', rStart: 1, cStart: 1 },
                { color: 'green', rStart: 1, cStart: 10 },
                { color: 'yellow', rStart: 10, cStart: 10 },
                { color: 'blue', rStart: 10, cStart: 1 }
            ];

            bases.forEach(b => {
                const baseDiv = document.createElement('div');
                baseDiv.className = `base-${b.color} relative`;
                baseDiv.style.gridRow = `${b.rStart} / ${b.rStart + 6}`;
                baseDiv.style.gridColumn = `${b.cStart} / ${b.cStart + 6}`;
                baseDiv.innerHTML = `<div class="base-inner-box"></div>`;
                grid.appendChild(baseDiv);

                // Render the 4 yard sockets using the exact same baseCoords as tokens
                PLAYER_META[b.color].baseCoords.forEach(coord => {
                    const socket = document.createElement('div');
                    socket.className = `yard-socket yard-socket-${b.color}`;
                    socket.style.left = `${((coord.c + 0.5) / 15) * 100}%`;
                    socket.style.top = `${((coord.r + 0.5) / 15) * 100}%`;
                    socketsLayer.appendChild(socket);
                });
            });

            // Center 4-Triangle 3D Gradient Home Goal
            const centerDiv = document.createElement('div');
            centerDiv.className = 'center-goal';
            centerDiv.innerHTML = `
                <svg viewBox="0 0 100 100" class="w-full h-full block">
                    <defs>
                        <linearGradient id="goalRed" x1="0%" y1="0%" x2="100%" y2="50%">
                            <stop offset="0%" stop-color="#f87171"/><stop offset="100%" stop-color="#b91c1c"/>
                        </linearGradient>
                        <linearGradient id="goalGreen" x1="50%" y1="0%" x2="50%" y2="100%">
                            <stop offset="0%" stop-color="#4ade80"/><stop offset="100%" stop-color="#15803d"/>
                        </linearGradient>
                        <linearGradient id="goalYellow" x1="100%" y1="50%" x2="0%" y2="50%">
                            <stop offset="0%" stop-color="#fde047"/><stop offset="100%" stop-color="#a16207"/>
                        </linearGradient>
                        <linearGradient id="goalBlue" x1="50%" y1="100%" x2="50%" y2="0%">
                            <stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#1d4ed8"/>
                        </linearGradient>
                    </defs>
                    <polygon points="0,0 50,50 0,100" fill="url(#goalRed)" stroke="#334155" stroke-width="1.5"/>
                    <polygon points="0,0 100,0 50,50" fill="url(#goalGreen)" stroke="#334155" stroke-width="1.5"/>
                    <polygon points="100,0 100,100 50,50" fill="url(#goalYellow)" stroke="#334155" stroke-width="1.5"/>
                    <polygon points="0,100 100,100 50,50" fill="url(#goalBlue)" stroke="#334155" stroke-width="1.5"/>
                </svg>
            `;
            grid.appendChild(centerDiv);

            // Generate the 72 track cells
            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 15; c++) {
                    if (isBaseCell(r, c) || isCenterCell(r, c)) continue;

                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.style.gridRow = r + 1;
                    cell.style.gridColumn = c + 1;

                    if (r === 7 && c >= 1 && c <= 5) cell.classList.add('track-red');
                    else if (r === 6 && c === 1) cell.classList.add('track-red');

                    else if (c === 7 && r >= 1 && r <= 5) cell.classList.add('track-green');
                    else if (r === 1 && c === 8) cell.classList.add('track-green');

                    else if (r === 7 && c >= 9 && c <= 13) cell.classList.add('track-yellow');
                    else if (r === 8 && c === 13) cell.classList.add('track-yellow');

                    else if (c === 7 && r >= 9 && r <= 13) cell.classList.add('track-blue');
                    else if (r === 13 && c === 6) cell.classList.add('track-blue');

                    const trackIdx = MAIN_TRACK.findIndex(pt => pt.r === r && pt.c === c);
                    if (STAR_TRACK_INDICES.has(trackIdx)) {
                        cell.innerHTML = `<svg class="w-4 h-4 sm:w-5 sm:h-5 text-slate-400 dark:text-slate-500 drop-shadow-sm" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>`;
                    }

                    if (r === 7 && c === 0) {
                        cell.classList.add('border-red-400');
                        cell.innerHTML = createEntryArrowSVG(0, 'text-red-600 dark:text-red-400');
                    }
                    if (r === 0 && c === 7) {
                        cell.classList.add('border-green-400');
                        cell.innerHTML = createEntryArrowSVG(90, 'text-green-600 dark:text-green-400');
                    }
                    if (r === 7 && c === 14) {
                        cell.classList.add('border-yellow-400');
                        cell.innerHTML = createEntryArrowSVG(180, 'text-yellow-600 dark:text-yellow-400');
                    }
                    if (r === 14 && c === 7) {
                        cell.classList.add('border-blue-400');
                        cell.innerHTML = createEntryArrowSVG(270, 'text-blue-600 dark:text-blue-400');
                    }

                    grid.appendChild(cell);
                }
            }
        }

        /**
         * ============================================================================
         * MATCH INITIALIZATION & FULLSCREEN MODE
         * ============================================================================
         */
        function startGame() {
            const activeColors = PLAYER_ORDER.filter(c => setupConfig[c].active);
            const errEl = document.getElementById('setup-error');
            if (activeColors.length < 2) {
                errEl.classList.remove('hidden');
                return;
            }
            errEl.classList.add('hidden');

            clearTimeout(gameState.aiTimer);

            gameState = {
                activeColors,
                players: {},
                turnIndex: 0,
                diceValue: null,
                phase: 'IDLE',
                consecutiveSixes: 0,
                rankings: [],
                statusText: '',
                aiTimer: null
            };

            const dict = t();
            PLAYER_ORDER.forEach((color, idx) => {
                const cfg = setupConfig[color];
                const finalName = cfg.name.trim() || (cfg.isAI ? dict.defaultBot(dict.colors[color]) : dict.defaultPlayer(idx + 1));
                cfg.name = finalName;

                gameState.players[color] = {
                    color,
                    active: cfg.active,
                    isAI: cfg.isAI,
                    name: finalName,
                    finishedRank: null,
                    tokens: [
                        { id: 0, step: -1 },
                        { id: 1, step: -1 },
                        { id: 2, step: -1 },
                        { id: 3, step: -1 }
                    ]
                };
            });

            document.body.classList.add('playing-mode');
            closeSettingsMenu();
            document.getElementById('lobby-header').classList.add('hidden');
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('victory-modal').classList.add('hidden');
            document.getElementById('game-arena').classList.remove('hidden');

            buildBoardDOM();
            createTokenElements();
            updateAllTokensVisual();
            renderPlayerCards();
            prepareTurn();
        }

        function rematch() {
            startGame();
        }

        function returnToSetup() {
            clearTimeout(gameState.aiTimer);
            const diceWidget = document.getElementById('active-dice-widget');
            const arena = document.getElementById('game-arena');
            if (diceWidget && arena) {
                diceWidget.classList.add('hidden');
                diceWidget.classList.remove('flex');
                arena.appendChild(diceWidget);
            }
            document.body.classList.remove('playing-mode');
            document.getElementById('victory-modal').classList.add('hidden');
            document.getElementById('game-arena').classList.add('hidden');
            document.getElementById('lobby-header').classList.remove('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
            renderSetupSlots();
        }

        function toggleModal(id, show) {
            document.getElementById(id).classList.toggle('hidden', !show);
        }

        function getCurrentPlayer() {
            const color = gameState.activeColors[gameState.turnIndex];
            return gameState.players[color];
        }

        /**
         * Renders all 4 corner player turn pods and embeds the 3D Dice Widget
         * directly inside the active player's card without overlapping the player name.
         */
        function renderPlayerCards() {
            const currentColor = gameState.activeColors[gameState.turnIndex];
            const dict = t();
            const diceWidget = document.getElementById('active-dice-widget');
            const arena = document.getElementById('game-arena');

            // Park diceWidget safely before re-rendering card HTML
            if (diceWidget && diceWidget.parentElement !== arena) {
                arena.appendChild(diceWidget);
            }

            PLAYER_ORDER.forEach(color => {
                const card = document.getElementById(`card-${color}`);
                const player = gameState.players[color];
                const meta = PLAYER_META[color];
                const colorLabel = dict.colors[color];

                if (!player || !player.active) {
                    card.innerHTML = `
                        <div class="w-full flex items-center justify-between opacity-45 px-1">
                            <div class="flex items-center gap-2">
                                <span class="w-3 h-3 rounded-full ${meta.badgeBg}"></span>
                                <span class="font-display font-bold text-xs sm:text-sm text-slate-500 dark:text-slate-400">${colorLabel}</span>
                            </div>
                            <span class="text-[11px] text-slate-400 dark:text-slate-500">${dict.inactive}</span>
                        </div>
                    `;
                    card.className = 'flex-1 max-w-[49.5%] surface-3d border border-slate-200/70 dark:border-slate-800 rounded-2xl p-2 sm:p-3 flex items-center justify-between min-h-[82px] sm:min-h-[90px] opacity-65';
                    return;
                }

                const isTurn = color === currentColor && gameState.phase !== 'GAMEOVER';
                const homeCount = player.tokens.filter(t => t.step === 56).length;

                card.className = `flex-1 max-w-[49.5%] surface-3d border-2 rounded-2xl p-2 sm:p-3 transition-all duration-200 flex items-center justify-between gap-2.5 min-h-[82px] sm:min-h-[90px] ${
                    isTurn ? `${meta.borderClass} ${meta.activeGlow} player-card-active` : 'border-slate-200/80 dark:border-slate-800 opacity-80'
                }`;

                let turnPillHtml = '';
                if (player.finishedRank) {
                    turnPillHtml = `<span class="inline-block px-2 py-0.5 rounded-full bg-amber-100 dark:bg-amber-500/20 text-amber-700 dark:text-amber-300 text-[10px] font-bold">${dict.shortMedals[player.finishedRank - 1]}</span>`;
                } else if (isTurn) {
                    turnPillHtml = `<span class="inline-block px-2 py-0.5 rounded-full ${meta.badgeBg} text-white text-[9px] font-bold uppercase tracking-wider shadow-sm">${player.isAI ? dict.botTurnBadge : dict.turnBadge}</span>`;
                }

                const pipsHtml = player.tokens.map(tk => {
                    const filled = tk.step === 56;
                    const out = tk.step >= 0 && tk.step < 56;
                    return `<span class="w-2.5 h-2.5 rounded-full border ${
                        filled ? `${meta.badgeBg} border-white shadow-sm` : out ? `border-slate-400 bg-slate-300 dark:bg-slate-600` : `border-slate-300 dark:border-slate-700 bg-slate-100 dark:bg-slate-800`
                    }"></span>`;
                }).join('');

                card.innerHTML = `
                    <div class="flex flex-col justify-between min-w-0 flex-1 gap-1">
                        <!-- Dedicated Full-Width Player Name Row (Never Overlapped) -->
                        <div class="flex items-center gap-1.5 min-w-0">
                            <span class="w-3.5 h-3.5 rounded-full ${meta.badgeBg} shrink-0 border border-white dark:border-slate-900 shadow-sm"></span>
                            <span class="font-display font-bold text-xs sm:text-sm text-slate-900 dark:text-white truncate">${player.name}</span>
                            <span class="text-[11px] shrink-0 opacity-75">${player.isAI ? '🤖' : '👤'}</span>
                        </div>

                        <!-- Dedicated Turn Badge & Live Status Row -->
                        <div class="flex items-center gap-1.5 min-w-0">
                            ${turnPillHtml}
                            <span class="text-[11px] sm:text-xs font-medium text-slate-600 dark:text-slate-300 truncate" id="card-status-${color}">
                                ${isTurn ? (gameState.statusText || dict.rollPrompt) : dict.homeProgress(homeCount)}
                            </span>
                        </div>

                        <!-- Token Progress Pips Row -->
                        <div class="flex items-center justify-between pt-0.5">
                            <div class="flex items-center gap-1">${pipsHtml}</div>
                            <span class="text-[10px] font-semibold text-slate-400 dark:text-slate-500">${homeCount}/4</span>
                        </div>
                    </div>
                `;

                // Mount the 3D Dice cleanly on the right side of the active player's card
                if (isTurn && diceWidget) {
                    diceWidget.classList.remove('hidden');
                    diceWidget.classList.add('flex');
                    card.appendChild(diceWidget);
                }
            });

            if (gameState.phase === 'GAMEOVER' && diceWidget) {
                diceWidget.classList.add('hidden');
                diceWidget.classList.remove('flex');
            }
        }

        /**
         * ============================================================================
         * 3D LOCATION-PIN TOKENS & SUB-CELL STACKING (EXACT TIP ALIGNMENT)
         * ============================================================================
         */
        function createLocationPinSVG(color, tokenId) {
            const meta = PLAYER_META[color];
            const gradId = `pinGrad-${color}-${tokenId}`;
            return `
                <svg viewBox="0 0 40 52" aria-hidden="true">
                    <defs>
                        <radialGradient id="${gradId}" cx="32%" cy="24%" r="72%">
                            <stop offset="0%" stop-color="${meta.gradLight}"/>
                            <stop offset="48%" stop-color="${meta.gradMid}"/>
                            <stop offset="100%" stop-color="${meta.gradDark}"/>
                        </radialGradient>
                    </defs>
                    <!-- Ground Contact Shadow Ellipse -->
                    <ellipse cx="20" cy="46.5" rx="9" ry="3.2" fill="rgba(15, 23, 42, 0.36)"/>
                    <!-- 3D Location Pin Teardrop Body -->
                    <path d="M20 2 C10.06 2 2 10.06 2 20 C2 32.8 20 46.5 20 46.5 C20 46.5 38 32.8 38 20 C38 10.06 29.94 2 20 2 Z"
                          fill="url(#${gradId})" stroke="#ffffff" stroke-width="2.6" stroke-linejoin="round"/>
                    <!-- Specular Rim Highlight -->
                    <path d="M9.5 14 C11.5 8.5 16.5 6 22 6.5" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="2" stroke-linecap="round"/>
                    <!-- Inner 3D Core Circle -->
                    <circle cx="20" cy="19.5" r="7.5" fill="#ffffff" stroke="rgba(15, 23, 42, 0.16)" stroke-width="1"/>
                    <circle cx="20" cy="19.5" r="4" fill="url(#${gradId})"/>
                </svg>
            `;
        }

        function createTokenElements() {
            const layer = document.getElementById('tokens-layer');
            layer.innerHTML = '';

            gameState.activeColors.forEach(color => {
                const player = gameState.players[color];
                player.tokens.forEach(token => {
                    const el = document.createElement('div');
                    el.id = `token-${color}-${token.id}`;
                    el.className = `token token-${color}`;
                    el.innerHTML = createLocationPinSVG(color, token.id);
                    el.onclick = () => onTokenClick(color, token.id);
                    layer.appendChild(el);
                });
            });
        }

        function getGlobalTrackIndex(color, step) {
            if (step < 0 || step > 50) return -1;
            return (PLAYER_META[color].startIndex + step) % 52;
        }

        function getTokenGridCoord(color, token) {
            const meta = PLAYER_META[color];
            if (token.step === -1) {
                return meta.baseCoords[token.id];
            } else if (token.step <= 50) {
                const gIdx = getGlobalTrackIndex(color, token.step);
                return MAIN_TRACK[gIdx];
            } else {
                return meta.homePath[token.step - 51];
            }
        }

        function updateAllTokensVisual(movableTokenIds = []) {
            const cellGroups = {};

            gameState.activeColors.forEach(color => {
                const player = gameState.players[color];
                player.tokens.forEach(token => {
                    const coord = getTokenGridCoord(color, token);
                    const key = `${coord.r.toFixed(2)},${coord.c.toFixed(2)}`;
                    if (!cellGroups[key]) cellGroups[key] = [];
                    cellGroups[key].push({ color, token, coord });
                });
            });

            const currentPlayer = getCurrentPlayer();

            Object.values(cellGroups).forEach(group => {
                const count = group.length;
                group.forEach((item, idx) => {
                    const el = document.getElementById(`token-${item.color}-${item.token.id}`);
                    if (!el) return;

                    let offsetR = 0;
                    let offsetC = 0;
                    let scale = 1;

                    // Keep stacked 3D pins neatly clustered inside the shared cell
                    if (count > 1 && item.token.step >= 0 && item.token.step < 56) {
                        scale = count >= 4 ? 0.68 : 0.78;
                        const angle = (idx / count) * Math.PI * 2;
                        const radius = 0.16;
                        offsetR = Math.sin(angle) * radius;
                        offsetC = Math.cos(angle) * radius;
                    }

                    const leftPct = ((item.coord.c + 0.5 + offsetC) / 15) * 100;
                    const topPct = ((item.coord.r + 0.5 + offsetR) / 15) * 100;

                    el.style.left = `${leftPct}%`;
                    el.style.top = `${topPct}%`;
                    el.style.setProperty('--tk-scale', scale);

                    const isMovable = (
                        gameState.phase === 'SELECTING' &&
                        !currentPlayer.isAI &&
                        item.color === currentPlayer.color &&
                        movableTokenIds.includes(item.token.id)
                    );

                    el.classList.toggle('movable', isMovable);
                    el.style.zIndex = isMovable ? 35 : (10 + Math.round(item.coord.r * 2) + idx);
                });
            });
        }

        /**
         * ============================================================================
         * DICE ROLLING & TURN FLOW (EMBEDDED IN ACTIVE PLAYER CARD)
         * ============================================================================
         */
        function setStatus(msg) {
            gameState.statusText = msg;
            const currentColor = gameState.activeColors[gameState.turnIndex];
            const el = document.getElementById(`card-status-${currentColor}`);
            if (el) el.textContent = msg;
        }

        function setDiceFaceRotation(val) {
            const cube = document.getElementById('dice-cube');
            const rotations = {
                1: 'rotateX(0deg) rotateY(0deg)',
                2: 'rotateX(0deg) rotateY(-90deg)',
                3: 'rotateX(0deg) rotateY(180deg)',
                4: 'rotateX(0deg) rotateY(90deg)',
                5: 'rotateX(-90deg) rotateY(0deg)',
                6: 'rotateX(90deg) rotateY(0deg)'
            };
            cube.style.transform = rotations[val] || rotations[1];
        }

        function prepareTurn() {
            const player = getCurrentPlayer();
            const dict = t();

            if (player.finishedRank !== null) {
                advanceToNextPlayer();
                return;
            }

            gameState.phase = 'IDLE';
            gameState.diceValue = null;
            gameState.statusText = player.isAI ? dict.aiThinking : dict.rollPrompt;

            renderPlayerCards();
            updateAllTokensVisual([]);

            if (player.isAI) {
                gameState.aiTimer = setTimeout(() => executeDiceRoll(), 650);
            }
        }

        function handleRollClick() {
            const player = getCurrentPlayer();
            if (gameState.phase !== 'IDLE' || player.isAI) return;
            executeDiceRoll();
        }

        function executeDiceRoll() {
            if (gameState.phase !== 'IDLE') return;
            gameState.phase = 'ROLLING';

            const cube = document.getElementById('dice-cube');
            cube.classList.add('rolling');
            playSound('roll');
            setStatus(t().rolling);

            setTimeout(() => {
                cube.classList.remove('rolling');
                const rolled = Math.floor(Math.random() * 6) + 1;
                gameState.diceValue = rolled;
                setDiceFaceRotation(rolled);
                onDiceRolled(rolled);
            }, 560);
        }

        function getValidMoves(player, dice) {
            const valid = [];
            player.tokens.forEach(token => {
                if (token.step === -1) {
                    if (dice === 6) valid.push(token.id);
                } else if (token.step >= 0 && token.step < 56) {
                    if (token.step + dice <= 56) valid.push(token.id);
                }
            });
            return valid;
        }

        function onDiceRolled(rolled) {
            const player = getCurrentPlayer();
            const dict = t();

            if (rolled === 6) {
                gameState.consecutiveSixes++;
                playSound('six');
                if (gameState.consecutiveSixes === 3) {
                    setStatus(dict.threeSixes);
                    gameState.consecutiveSixes = 0;
                    setTimeout(() => advanceToNextPlayer(), 1100);
                    return;
                }
            } else {
                gameState.consecutiveSixes = 0;
            }

            const validTokenIds = getValidMoves(player, rolled);

            if (validTokenIds.length === 0) {
                setStatus(dict.noMoves(rolled));
                setTimeout(() => {
                    if (rolled === 6) {
                        prepareTurn();
                    } else {
                        advanceToNextPlayer();
                    }
                }, 950);
                return;
            }

            gameState.phase = 'SELECTING';
            updateAllTokensVisual(validTokenIds);

            if (player.isAI) {
                setStatus(dict.aiRolled(rolled));
                gameState.aiTimer = setTimeout(() => {
                    const chosenId = chooseAIMove(player, validTokenIds, rolled);
                    moveTokenStepByStep(player, chosenId, rolled);
                }, 550);
            } else {
                const allInBase = validTokenIds.every(id => player.tokens[id].step === -1);
                if (validTokenIds.length === 1 || allInBase) {
                    setStatus(dict.autoMoving(rolled));
                    setTimeout(() => moveTokenStepByStep(player, validTokenIds[0], rolled), 380);
                } else {
                    setStatus(dict.selectToken(rolled));
                }
            }
        }

        function onTokenClick(color, tokenId) {
            const player = getCurrentPlayer();
            if (gameState.phase !== 'SELECTING' || player.isAI || player.color !== color) return;

            const validIds = getValidMoves(player, gameState.diceValue);
            if (!validIds.includes(tokenId)) return;

            moveTokenStepByStep(player, tokenId, gameState.diceValue);
        }

        /**
         * ============================================================================
         * TOKEN MOVEMENT, CAPTURING & VICTORY EVALUATION
         * ============================================================================
         */
        function moveTokenStepByStep(player, tokenId, dice) {
            gameState.phase = 'ANIMATING';
            updateAllTokensVisual([]);

            const token = player.tokens[tokenId];

            if (token.step === -1) {
                token.step = 0;
                playSound('safe');
                updateAllTokensVisual([]);
                setTimeout(() => resolveLanding(player, token, dice), 320);
                return;
            }

            let stepsLeft = dice;
            const stepInterval = setInterval(() => {
                token.step++;
                stepsLeft--;
                playSound('step');
                updateAllTokensVisual([]);

                if (stepsLeft <= 0) {
                    clearInterval(stepInterval);
                    setTimeout(() => resolveLanding(player, token, dice), 260);
                }
            }, 210);
        }

        function resolveLanding(player, movedToken, rolledDice) {
            let bonusRoll = (rolledDice === 6);
            let eventMessage = '';
            const dict = t();

            if (movedToken.step === 56) {
                playSound('home');
                bonusRoll = true;
                eventMessage = dict.reachedHome;
                renderPlayerCards();
            } else if (movedToken.step >= 0 && movedToken.step <= 50) {
                const globalIdx = getGlobalTrackIndex(player.color, movedToken.step);

                if (SAFE_TRACK_INDICES.has(globalIdx)) {
                    if (STAR_TRACK_INDICES.has(globalIdx)) playSound('safe');
                } else {
                    let capturedAny = false;
                    gameState.activeColors.forEach(oppColor => {
                        if (oppColor === player.color) return;
                        const oppPlayer = gameState.players[oppColor];
                        oppPlayer.tokens.forEach(oppToken => {
                            if (oppToken.step >= 0 && oppToken.step <= 50) {
                                const oppGlobalIdx = getGlobalTrackIndex(oppColor, oppToken.step);
                                if (oppGlobalIdx === globalIdx) {
                                    oppToken.step = -1;
                                    capturedAny = true;
                                }
                            }
                        });
                    });

                    if (capturedAny) {
                        playSound('capture');
                        bonusRoll = true;
                        eventMessage = dict.captured;
                        updateAllTokensVisual([]);
                        renderPlayerCards();
                    }
                }
            }

            const allHome = player.tokens.every(t => t.step === 56);
            if (allHome && player.finishedRank === null) {
                gameState.rankings.push(player.color);
                player.finishedRank = gameState.rankings.length;
                playSound('win');
                renderPlayerCards();

                if (gameState.rankings.length >= gameState.activeColors.length - 1) {
                    const remaining = gameState.activeColors.find(c => !gameState.rankings.includes(c));
                    if (remaining) {
                        gameState.rankings.push(remaining);
                        gameState.players[remaining].finishedRank = gameState.rankings.length;
                    }
                    showVictoryModal();
                    return;
                }
                setStatus(dict.finishedRank(player.finishedRank));
                setTimeout(() => advanceToNextPlayer(), 1200);
                return;
            }

            if (eventMessage) setStatus(eventMessage);

            setTimeout(() => {
                if (bonusRoll) {
                    if (!eventMessage) setStatus(dict.bonusRoll);
                    setTimeout(() => prepareTurn(), 550);
                } else {
                    gameState.consecutiveSixes = 0;
                    advanceToNextPlayer();
                }
            }, eventMessage ? 750 : 250);
        }

        function advanceToNextPlayer() {
            gameState.consecutiveSixes = 0;
            const total = gameState.activeColors.length;
            for (let i = 1; i <= total; i++) {
                const nextIdx = (gameState.turnIndex + i) % total;
                const nextColor = gameState.activeColors[nextIdx];
                if (gameState.players[nextColor].finishedRank === null) {
                    gameState.turnIndex = nextIdx;
                    prepareTurn();
                    return;
                }
            }
        }

        /**
         * ============================================================================
         * SMART AI BOT DECISION ENGINE
         * ============================================================================
         */
        function chooseAIMove(player, validTokenIds, dice) {
            let bestTokenId = validTokenIds[0];
            let bestScore = -9999;

            validTokenIds.forEach(id => {
                const token = player.tokens[id];
                let score = 0;

                if (token.step === -1 && dice === 6) {
                    score += 85;
                } else {
                    const targetStep = token.step + dice;

                    if (targetStep === 56) {
                        score += 120;
                    } else if (token.step <= 50 && targetStep > 50) {
                        score += 75;
                    } else if (targetStep <= 50) {
                        const targetGlobal = getGlobalTrackIndex(player.color, targetStep);

                        if (!SAFE_TRACK_INDICES.has(targetGlobal)) {
                            let canCapture = false;
                            gameState.activeColors.forEach(oppColor => {
                                if (oppColor === player.color) return;
                                gameState.players[oppColor].tokens.forEach(oppT => {
                                    if (oppT.step >= 0 && oppT.step <= 50 &&
                                        getGlobalTrackIndex(oppColor, oppT.step) === targetGlobal) {
                                        canCapture = true;
                                    }
                                });
                            });
                            if (canCapture) score += 140;
                        }

                        if (SAFE_TRACK_INDICES.has(targetGlobal)) {
                            score += 55;
                        }

                        const currentGlobal = getGlobalTrackIndex(player.color, token.step);
                        if (SAFE_TRACK_INDICES.has(currentGlobal)) {
                            score -= 15;
                        }
                    }

                    score += targetStep * 0.6;
                }

                if (score > bestScore) {
                    bestScore = score;
                    bestTokenId = id;
                }
            });

            return bestTokenId;
        }

        /**
         * ============================================================================
         * VICTORY PODIUM & KEYBOARD SHORTCUTS
         * ============================================================================
         */
        function showVictoryModal() {
            gameState.phase = 'GAMEOVER';
            renderPlayerCards();
            const dict = t();

            const list = document.getElementById('podium-list');
            list.innerHTML = '';

            gameState.rankings.forEach((color, idx) => {
                const player = gameState.players[color];
                const meta = PLAYER_META[color];
                const row = document.createElement('div');
                row.className = `flex items-center justify-between p-3 rounded-2xl border ${
                    idx === 0
                        ? 'bg-amber-50 dark:bg-amber-500/15 border-amber-300 dark:border-amber-500/40'
                        : 'bg-slate-50 dark:bg-slate-800/80 border-slate-200 dark:border-slate-700'
                }`;
                row.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-4 h-4 rounded-full ${meta.badgeBg} border border-white dark:border-slate-900"></span>
                        <span class="font-display font-bold text-slate-900 dark:text-white">${player.name}</span>
                    </div>
                    <span class="font-bold text-sm ${idx === 0 ? 'text-amber-600 dark:text-amber-400' : 'text-slate-600 dark:text-slate-300'}">${dict.medals[idx]}</span>
                `;
                list.appendChild(row);
            });

            toggleModal('victory-modal', true);
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !document.getElementById('game-arena').classList.contains('hidden')) {
                const player = getCurrentPlayer();
                if (player && !player.isAI && gameState.phase === 'IDLE') {
                    e.preventDefault();
                    handleRollClick();
                }
            }
        });

        applyTranslations();
        renderSetupSlots();
    </script>
</body>
